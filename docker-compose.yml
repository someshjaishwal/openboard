services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: openboard
      POSTGRES_PASSWORD: openboard
      POSTGRES_DB: openboard
    volumes:
      - openboard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openboard -d openboard"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  openboard_pg:
